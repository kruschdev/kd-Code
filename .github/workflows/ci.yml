name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install browser test runtime
        run: |
          cd apps/web
          bunx playwright install --with-deps chromium

      - name: Browser test
        run: bun run --cwd apps/web test:browser
        continue-on-error: true

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs

      - name: Instant Failure Push Notification
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: 🚨 CI Failure: ${{ github.repository }} (Quality Job)" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light,x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Run #${{ github.run_number }} failed on ${{ github.ref_name }}. Commit: ${{ github.sha }} by ${{ github.actor }}." \
            https://ntfy.sh/krusch-ci-alerts || true

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Exercise release-only workflow steps
        run: bun scripts/release-smoke.ts

      - name: Instant Failure Push Notification
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: 🚨 CI Failure: ${{ github.repository }} (Release Smoke)" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light,x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Run #${{ github.run_number }} failed on ${{ github.ref_name }}. Commit: ${{ github.sha }} by ${{ github.actor }}." \
            https://ntfy.sh/krusch-ci-alerts || true

  harness_invariant:
    name: Write Invariant & CI Fixtures (krusch@e5b16c2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kdcode
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kdcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout kd-Code
        uses: actions/checkout@v4
        with:
          path: kd-Code

      - name: Checkout pinned krusch (e5b16c2)
        uses: actions/checkout@v4
        with:
          repository: kruschdev/krusch
          ref: e5b16c2acc8c3c61205e40afe3391c1c3d1f4007
          path: krusch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: kd-Code/package.json

      - name: Install krusch dependencies
        run: |
          cd krusch
          npm ci || npm install
          git checkout -- package-lock.json 2>/dev/null || true

      - name: Bootstrap krusch database schema
        run: |
          cd krusch
          node db/migrate.js
        env:
          DATABASE_URL: postgres://kdcode:password@localhost:5432/kdcode

      - name: Install kd-Code dependencies
        run: |
          cd kd-Code
          bun install --frozen-lockfile --ignore-scripts

      - name: Verify Pin Enforcement (kdcode doctor)
        run: |
          cd kd-Code
          node bin/kdcode.js doctor krusch
        env:
          DATABASE_URL: postgres://kdcode:password@localhost:5432/kdcode
          KRUSCH_HARNESS: ../krusch/bin/krusch.js

      - name: Prove 7-Step Write Invariant (demo-invariant)
        run: |
          cd kd-Code
          node bin/kdcode.js demo-invariant
        env:
          DATABASE_URL: postgres://kdcode:password@localhost:5432/kdcode
          KRUSCH_HARNESS: ../krusch/bin/krusch.js

      - name: Run CI Fixture Verifications
        run: |
          cd kd-Code
          node scripts/run-ci-fixtures.js
        env:
          DATABASE_URL: postgres://kdcode:password@localhost:5432/kdcode
          KRUSCH_HARNESS: ../krusch/bin/krusch.js

      - name: Instant Failure Push Notification
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: 🚨 CI Failure: ${{ github.repository }} (Harness Invariant)" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light,x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Run #${{ github.run_number }} failed on ${{ github.ref_name }}. Commit: ${{ github.sha }} by ${{ github.actor }}." \
            https://ntfy.sh/krusch-ci-alerts || true
