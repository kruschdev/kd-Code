name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Cache Bun and Turbo
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install browser test runtime
        run: |
          cd apps/web
          bunx playwright install --with-deps chromium

      - name: Browser test
        run: bun run --cwd apps/web test:browser

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs

  release_smoke:
    name: Release Smoke
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  harness_invariant:
    name: Write Invariant & CI Fixtures (krusch@1e69883)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kdcode
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kdcode
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout kd-Code
        uses: actions/checkout@v4
        with:
          path: kd-Code

      - name: Checkout pinned krusch (1e69883)
        uses: actions/checkout@v4
        with:
          repository: kruschdev/krusch
          ref: 1e69883
          path: krusch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install krusch dependencies
        run: |
          cd krusch
          npm install

      - name: Bootstrap krusch database schema
        run: |
          cd krusch
          node db/migrate.js
        env:
          DATABASE_URL: postgres://kdcode:password@localhost:5432/kdcode

      - name: Install kd-Code dependencies
        run: |
          cd kd-Code
          bun install --frozen-lockfile

      - name: Verify Pin Enforcement (kdcode doctor)
        run: |
          cd kd-Code
          node bin/kdcode.js doctor
        env:
          DATABASE_URL: postgres://kdcode:password@localhost:5432/kdcode
          KRUSCH_HARNESS: ../krusch/bin/krusch.js

      - name: Prove 7-Step Write Invariant (demo-invariant)
        run: |
          cd kd-Code
          node bin/kdcode.js demo-invariant
        env:
          DATABASE_URL: postgres://kdcode:password@localhost:5432/kdcode
          KRUSCH_HARNESS: ../krusch/bin/krusch.js

      - name: Run CI Fixture Verifications
        run: |
          cd kd-Code
          node scripts/run-ci-fixtures.js
        env:
          DATABASE_URL: postgres://kdcode:password@localhost:5432/kdcode
          KRUSCH_HARNESS: ../krusch/bin/krusch.js

