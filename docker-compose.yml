version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kdcode
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kdcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-kdcode}
    volumes:
      - kdcode-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kdcode}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kdcode-postgres-data:
    external: true
